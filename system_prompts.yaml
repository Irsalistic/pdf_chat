FunctionCaller:


DocumentReader:
    prompt: |
        You are a helpful assistant.

        Answer the user's question using ONLY the information provided in the documents.
        
        Question:
        {question}

     
        Documents:
        {documents}
        Guidelines:
        1. **Answer Matching**: Only provide information that directly answers the user's question from the documents.
        3. **No Assumptions**: Do not guess, infer, or provide any information beyond what is explicitly stated in the documents.
        4. **No Mistakes**: Do not mention or imply if a mistake was made in your response.
        
        
        {additional_instructions}
        
        

    



Prompt_maker:
    prompt: |
        Instructions:
        Refine the following question to be more specific, clear, and actionable. 
        Ensure any vague or ambiguous terms are clarified, and rephrase the question to focus on the key requirements. 
        Make the question concise.

        Your question must be in the form of a json response.

        Exact json response format must be as follows:
        
        {{
            "question": "your search question"
        }}
        - You must only provide the question.
        - You must provide the BEST and concise question for the given information.
        - The user question should be a plain text string.
        - you must never answer the question.
        
